<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What did you find?</title>
<style>
  :root { --page:#1c1c1e; --box:#fff; --ink:#222; --sub:#555; --line:#fff; --line-w:2;
          --fs:14px; --head-h:36px; --min-w:64px; --open-w:230px; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--page); min-height:100vh; display:flex; justify-content:center;
         font-family:system-ui,"Noto Sans TC",sans-serif;
         padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); }
  #stage { position:relative; width:100%; line-height:0; align-self:flex-start; }
  #pic { width:100%; height:auto; display:block; }
  #lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  #lines path { fill:none; stroke:var(--line); stroke-width:var(--line-w); stroke-linejoin:round;
                filter:drop-shadow(0 0 2px rgba(0,0,0,.6)); }
  #lines circle { fill:var(--line); stroke:#000; stroke-opacity:.6; stroke-width:1; pointer-events:none; }

  /* ===== 標籤外觀:想換成自己畫的 UI 就改這一段 ===== */
  .label { position:absolute; background:var(--box); color:var(--ink); line-height:1.5;
           min-width:var(--min-w); box-shadow:0 2px 10px rgba(0,0,0,.4); z-index:2;
           /* 框格變寬的動畫:時間和速度曲線可以在這裡調 */
           transition:width .5s cubic-bezier(.22,.8,.3,1), left .5s cubic-bezier(.22,.8,.3,1); }
  .label.pop { animation:pop .38s cubic-bezier(.3,1.4,.5,1); transform-origin:left center; }
  @keyframes pop { 0% { transform:scale(.93); } 100% { transform:scale(1); } }
  .label.wide { z-index:3; width:var(--open-w); }
  .head { display:block; width:100%; height:var(--head-h); padding:0 12px; border:0; background:none;
          font-weight:600; font-size:var(--fs); font-family:inherit; color:inherit; cursor:pointer;
          text-align:left; white-space:nowrap; }
  /* 窗簾往下垂的動畫:時間和速度曲線可以在這裡調 */
  .detail { display:grid; grid-template-rows:0fr; width:0; min-width:100%; font-size:var(--dfs,12px); line-height:1.5; color:var(--sub);
            border-top:1px solid transparent;
            transition:grid-template-rows .6s cubic-bezier(.22,.8,.3,1), border-color .3s; }
  .label.open .detail { grid-template-rows:1fr; border-top-color:#ddd; }
  .detail-in { overflow:hidden; min-height:0; }
  .detail-body { width:var(--open-w); padding:0 12px 10px; opacity:0; transform:translateY(-16px);
                 transition:transform .6s cubic-bezier(.22,.8,.3,1), opacity .4s; }
  .label.open .detail-body { opacity:1; transform:none; transition-delay:.05s; }
  .detail img { width:100%; margin:8px 0 0; display:block; }
  .detail p { margin:6px 0 0; white-space:pre-line; }   /* pre-line:文字裡的換行會照樣顯示 */
  @media (prefers-reduced-motion:reduce) { .label, .detail, .detail-body { transition:none; } .label.pop { animation:none; } }
  /* ============================================== */
</style>
</head>
<body>
<div id="stage">
  <img id="pic" alt="互動插圖">
  <svg id="lines"></svg>
</div>
<script>
/* =====================================================

   title       = 標籤上顯示的名稱
   text        = 點開後的詳細介紹
                 (換行請寫 \n,想空一行就寫 \n\n;或用 ` ` 把文字包起來,直接按 Enter 換行)

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const stage = $('stage'), pic = $('pic'), svg = $('lines');
let openItem = null;

function applyUI() {
  const u = CONFIG.ui, s = document.documentElement.style;
  s.setProperty('--box', u.boxColor); s.setProperty('--ink', u.textColor);
  s.setProperty('--sub', u.subColor); s.setProperty('--line', u.lineColor);
  s.setProperty('--line-w', u.lineWidth); s.setProperty('--fs', u.fontSize + 'px');
  s.setProperty('--head-h', u.headHeight + 'px'); s.setProperty('--min-w', u.minWidth + 'px');
  s.setProperty('--open-w', u.openWidth + 'px'); s.setProperty('--dfs', u.detailFontSize + 'px');
  stage.style.maxWidth = u.maxWidth + 'px';
}
applyUI();
pic.src = CONFIG.image;

const OVERRIDES = { fontSize:'--fs', headHeight:'--head-h', minWidth:'--min-w', openWidth:'--open-w' };
const els = CONFIG.items.map(it => {
  const label = document.createElement('div');
  label.className = 'label';
  label.style.left = it.lx + '%';
  label.style.top = it.ly + '%';
  for (const k in OVERRIDES) if (it[k]) label.style.setProperty(OVERRIDES[k], it[k] + 'px');
  const head = document.createElement('button');
  head.className = 'head';
  head.textContent = it.title;
  const detail = document.createElement('div');
  detail.className = 'detail';
  detail.innerHTML = '<div class="detail-in"><div class="detail-body"></div></div>';
  const body = detail.querySelector('.detail-body');
  if (it.image) { const im = document.createElement('img'); im.src = it.image; im.alt = ''; body.appendChild(im); }
  const p = document.createElement('p'); p.textContent = it.text || ''; body.appendChild(p);
  label.append(head, detail);
  stage.appendChild(label);
  const path = document.createElementNS(NS, 'path');
  const dot = document.createElementNS(NS, 'circle'); dot.setAttribute('r', 4);
  svg.append(path, dot);
  const o = { it, label, head, path, dot };
  head.addEventListener('click', () => { if (!head.moved) toggle(o); });
  return o;
});

function animateDraw(ms) {   // 動畫期間每一幀重畫連接線,讓線跟著方框動
  const t0 = performance.now();
  (function f() { draw(); if (performance.now() - t0 < ms) requestAnimationFrame(f); })();
}
function closeLabel(o) {
  clearTimeout(o.timer);
  o.label.classList.remove('open');
  o.label.style.width = (o.w0 || o.label.offsetWidth) + 'px';   // 寬度縮回去
  o.label.style.left = o.it.lx + '%';
  o.timer = setTimeout(() => {   // 等收起動畫結束後,才還原成自動寬度
    o.label.classList.remove('wide');
    o.label.style.width = '';
    draw();
  }, 650);
}
function toggle(o) {
  const wasOpen = openItem === o;
  if (openItem) closeLabel(openItem);
  openItem = null;
  if (!wasOpen) {
    clearTimeout(o.timer);
    const L = o.label, sr = stage.getBoundingClientRect();
    const startW = L.offsetWidth;
    if (!L.classList.contains('wide')) o.w0 = startW;
    L.style.transition = 'none';                            // 量尺寸時先關掉動畫,避免干擾
    L.classList.add('wide');
    L.style.width = ''; const w1 = L.offsetWidth;          // 量出展開後的寬度
    L.style.width = startW + 'px'; void L.offsetWidth;     // 退回目前寬度
    L.style.transition = '';                               // 動畫打開
    L.style.width = '';                                    // 變成展開寬度(這一步會做動畫)
    const left0 = sr.width * o.it.lx / 100;
    L.style.left = (left0 + w1 > sr.width) ? (sr.width - w1) + 'px' : o.it.lx + '%';   // 超出右邊就往左靠
    openItem = o;
    L.classList.add('open');
    L.classList.remove('pop'); void L.offsetWidth; L.classList.add('pop');   // 點下去的一瞬間輕輕彈一下
  }
  animateDraw(750);
}
function draw() {
  const sr = stage.getBoundingClientRect();
  els.forEach(o => {
    const { it, head, path, dot, label } = o;
    // 線只依「收起時」的方框位置來畫,所以展開、變寬、往左靠都不會讓線跑掉
    if (!label.classList.contains('wide')) o.w0 = label.offsetWidth;
    const w0 = o.w0 || label.offsetWidth;
    const px = it.x / 100 * sr.width, py = it.y / 100 * sr.height;
    const left = it.lx / 100 * sr.width;
    const hy = it.ly / 100 * sr.height + head.offsetHeight / 2;
    const labelRight = left + w0 / 2 > px;
    const edge = labelRight ? left : left + w0;
    const mid = (px + edge) / 2;
    path.setAttribute('d', `M${px},${py} H${mid} V${hy} H${edge}`);
    dot.setAttribute('cx', px); dot.setAttribute('cy', py);
  });
}
new ResizeObserver(draw).observe(stage);
pic.addEventListener('load', draw);
window.addEventListener('resize', draw);
draw();

</script>
</body>
